<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Slope Plus</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#gameContainer {
    width: 100%;
    height: 100%;
}

#fullscreenButton {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 99999;

    padding: 10px 16px;

    background: rgba(0, 0, 0, 0.75);
    color: white;

    border: 1px solid white;
    border-radius: 6px;

    font-family: Arial, sans-serif;
    font-size: 14px;

    cursor: pointer;
}

#fullscreenButton:hover {
    background: rgba(255, 255, 255, 0.2);
}
</style>
</head>

<body>

<div id="gameContainer"></div>

<button id="fullscreenButton">Fullscreen</button>

<script>

const BUILD =
"externalfile:arc-content/content%253A%252F%252Fcom.android.externalstorage.documents%252Fdocument%252F0000000000000000000000000000CAFEF00D2019%25253ADownloads%25252Fidk%25252FBuild%25252F";

const LOADER_PATH =
BUILD + "UnityLoader.js";

const JSON_PATH =
BUILD + "SlopePlusWeb.json";

const DATA_PATH =
BUILD + "SlopePlusWeb.data.unityweb";

const WASM_CODE_PATH =
BUILD + "SlopePlusWeb.wasm.code.unityweb";

const WASM_FRAMEWORK_PATH =
BUILD + "SlopePlusWeb.wasm.framework.unityweb";


/*
 * Redirect Unity's build requests.
 */

const oldOpen = XMLHttpRequest.prototype.open;

XMLHttpRequest.prototype.open = function(method, url) {

    if (typeof url === "string") {

        if (url.includes("SlopePlusWeb.data.unityweb")) {
            url = DATA_PATH;

        } else if (url.includes("SlopePlusWeb.wasm.code.unityweb")) {
            url = WASM_CODE_PATH;

        } else if (url.includes("SlopePlusWeb.wasm.framework.unityweb")) {
            url = WASM_FRAMEWORK_PATH;

        } else if (url.includes("SlopePlusWeb.json")) {
            url = JSON_PATH;
        }
    }

    return oldOpen.call(this, method, url);
};


/*
 * Fullscreen
 */

const fullscreenButton =
    document.getElementById("fullscreenButton");

fullscreenButton.addEventListener("click", function() {

    const element = document.documentElement;

    if (!document.fullscreenElement) {

        if (element.requestFullscreen) {
            element.requestFullscreen();
        }

    } else {

        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }

});


/*
 * Update button text.
 */

document.addEventListener("fullscreenchange", function() {

    if (document.fullscreenElement) {
        fullscreenButton.style.display = "none";
    } else {
        fullscreenButton.style.display = "block";
    }

});


/*
 * Load UnityLoader.
 */

const script = document.createElement("script");

script.onload = function() {

    UnityLoader.instantiate(
        "gameContainer",
        JSON_PATH
    );

};

script.src = LOADER_PATH;

document.head.appendChild(script);

</script>

</body>
</html>
